[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextdnsctl"
dynamic = ["version"]
description = "Manage NextDNS profiles declaratively from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Meint", email = "pilots-4-trilogy@icloud.com" }]
requires-python = ">=3.10"
keywords = ["nextdns", "cli", "dns", "security", "networking"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "idna>=3.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "requests-mock>=1.11",
    "flake8>=7.0",
    "black==24.2.0",
    "mypy>=1.0",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
    "pre-commit>=3.6",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
nextdnsctl = "nextdnsctl.cli:main"

[project.urls]
Homepage = "https://github.com/danielmeint/nextdnsctl"
Issues = "https://github.com/danielmeint/nextdnsctl/issues"

[tool.hatch.version]
path = "nextdnsctl/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["nextdnsctl", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["nextdnsctl"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = ["live: talks to the real NextDNS API (needs NEXTDNS_API_KEY; run with -m live)"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
